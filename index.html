<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuthDiff · Authorization review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3fb;color:#252142;font:16px system-ui}main{max-width:1080px;margin:auto;padding:40px 24px}header{border-top:6px solid #6851b6;padding-top:20px}h1{font-size:clamp(2rem,6vw,4rem);letter-spacing:-.05em;margin:10px 0}small{color:#54418e;font-weight:700;letter-spacing:.15em}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}label{font-weight:600}textarea{width:100%;height:250px;margin-top:8px;padding:12px;border:1px solid #a39abb;border-radius:8px;font:13px monospace}button{background:#483380;color:white;border:0;border-radius:6px;padding:12px 18px;margin:0 8px 8px 0;cursor:pointer}button.secondary{background:#e5e1f4;color:#352761}.summary{background:#e5e1f4;border-radius:8px;padding:12px 16px;margin-top:12px}.summary b{display:block;font-size:.8rem;letter-spacing:.1em;margin-bottom:4px}article{background:white;border-left:4px solid #6851b6;padding:16px;margin-top:12px}.values{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.values p{margin:0;background:#f4f3fb;padding:12px;overflow-wrap:anywhere}.values b{display:block;font-size:.8rem;margin-bottom:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:650px){.inputs{grid-template-columns:1fr}}
</style>
<main><header><small>AUTHDIFF / REVIEW WORKBENCH</small><h1>Inspect the authorization delta</h1><p>Compare two ordered Soroban invocation trees. Review who authorizes each call and what arguments changed.</p></header>
<div class="inputs"><label>Baseline<textarea id="baseline" spellcheck="false" placeholder="Paste a normalized tree or authorization entry XDR"></textarea></label><label>Candidate<textarea id="candidate" spellcheck="false" placeholder="Paste the candidate tree or authorization entry XDR"></textarea></label></div>
<label for="format">Input format</label> <select id="format"><option value="normalized">Normalized tree</option><option value="xdr">Authorization entry XDR</option></select>
<div><button id="sample">Load example</button><button id="testnet">Load testnet capture</button><button id="swap" class="secondary">Swap sides</button><button id="compare">Compare trees</button></div>
<p id="status" role="status" aria-live="polite"></p><section id="results" aria-label="Changes"></section>
</main><script>
const el = id => document.getElementById(id);
async function loadExample(path, format) {
  try {
    const response = await fetch(path);
    if (!response.ok) throw Error('Example unavailable');
    const {before,after} = await response.json();
    el('format').value = format;
    el('baseline').value = JSON.stringify(before,null,2);
    el('candidate').value = JSON.stringify(after,null,2);
    el('status').textContent = 'Loaded ' + path.replace('/', '') + ' as ' + format + ' input';
  } catch (error) { el('status').textContent = error.message; }
}
el('sample').onclick = () => loadExample('/example', 'normalized');
el('testnet').onclick = () => loadExample('/testnet-example', 'xdr');
el('swap').onclick = () => {
  const baseline = el('baseline').value;
  el('baseline').value = el('candidate').value;
  el('candidate').value = baseline;
  el('status').textContent = 'Baseline and candidate swapped';
};
el('compare').onclick = async () => {
  el('results').replaceChildren();
  try {
    const response = await fetch(el('format').value === 'xdr' ? '/compare-xdr' : '/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      before:JSON.parse(el('baseline').value),after:JSON.parse(el('candidate').value)
    })});
    const result = await response.json();
    if (!response.ok) throw Error(result.error);
    const summary = result.summary ?? {total: result.changes.length, counts: {}};
    const parts = Object.entries(summary.counts).filter(([, count]) => count > 0).map(([kind, count]) => kind + ' ×' + count);
    el('status').textContent = summary.total + ' differences in the supplied trees' + (parts.length ? ' · ' + parts.join(', ') : '');
    for (const change of result.changes) {
      const card = document.createElement('article');
      const title = document.createElement('strong');
      title.textContent = change.kind + ' · ' + change.path.join(' / ');
      const detail = document.createElement('pre');
      detail.textContent = JSON.stringify({before:change.before ?? null,after:change.after ?? null},null,2);
      card.append(title);
      if (change.kind === 'argument-changed') {
        const values = document.createElement('div');
        values.className = 'values';
        for (const [label, value] of [['Baseline', change.before], ['Candidate', change.after]]) {
          const panel = document.createElement('p');
          const heading = document.createElement('b');
          heading.textContent = label;
          panel.append(heading, document.createTextNode(value?.decimal ?? value?.xdr ?? 'Absent'));
          values.append(panel);
        }
        const raw = document.createElement('details');
        const summaryLabel = document.createElement('summary');
        summaryLabel.textContent = 'Inspect argument XDR';
        raw.append(summaryLabel, detail);
        card.append(values, raw);
      } else {
        card.append(detail);
      }
      el('results').append(card);
    }
  } catch (error) { el('status').textContent = error.message; }
};
</script></html>
